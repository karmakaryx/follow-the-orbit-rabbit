[project]
name = "follow-the-orbit-rabbit"
version = "0.1.0"
description = "Space-Track TLE Data Pipeline & Collision Avoidance MLOps System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow>=3.0.0",
    "apache-airflow-providers-docker>=4.5.9",
    "boto3>=1.43.78",
    "docker>=7.2.0",
    "pandas>=3.0.5",
    "parquet>=1.3.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sgp4>=2.27",
    "skyfield>=1.55",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
