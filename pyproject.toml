version = "0.1.0"
description = "Space-Track TLE Data Pipeline & Collision Avoidance MLOps System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow==3.3.1",
    "apache-airflow-providers-docker>=4.5.9",
    "boto3>=1.43.78",
    "docker>=7.2.0",
    "fastapi>=0.136.3",
    "pandas>=3.0.5",
    "parquet>=1.3.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pytorch-lightning>=2.6.5",
    "requests>=2.34.2",
    "scipy>=1.16.0",
    "sgp4>=2.27",
    "skyfield>=1.55",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.4",
    "wandb>=0.29.0",
]

[tool.uv]
package = false
